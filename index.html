    <div id="root"></div>
    <script>
      (function() {
        var RELOAD_FLAG = '__sw_recovery_reload__';
        var hasAttemptedReload = false;

        function cleanupAndReload() {
          if (hasAttemptedReload) return;
          hasAttemptedReload = true;

          var cleanups = [];
          if ('serviceWorker' in navigator) {
            cleanups.push(
              navigator.serviceWorker.getRegistrations().then(function(registrations) {
                return Promise.all(registrations.map(function(r) { return r.unregister(); }));
              }).catch(function() {})
            );
          }
          if ('caches' in window) {
            cleanups.push(
              caches.keys().then(function(keys) {
                return Promise.all(keys.map(function(k) { return caches.delete(k); }));
              }).catch(function() {})
            );
          }
          Promise.all(cleanups).finally(function() {
            window.location.reload();
          });
        }

        window.addEventListener('error', function(event) {
          var target = event.target;
          if (!target) return;
          var tagName = (target.tagName || '').toUpperCase();
          if (tagName !== 'SCRIPT' && tagName !== 'LINK') return;

          var url = target.src || target.href || '';
          if (
            url.indexOf('/assets/') !== -1 ||
            url.indexOf('/src/') !== -1 ||
            url.indexOf('/@') !== -1 ||
            url.indexOf('/node_modules/') !== -1
          ) {
            var canReload = false;
            try {
              if (!sessionStorage.getItem(RELOAD_FLAG)) {
                sessionStorage.setItem(RELOAD_FLAG, '1');
                canReload = true;
              }
            } catch (e) {
              if (!hasAttemptedReload) {
                canReload = true;
              }
            }

            if (canReload) {
              cleanupAndReload();
            }
          }
        }, true);

        window.addEventListener('load', function() {
          setTimeout(function() {
            try {
              var root = document.getElementById('root');
              if (root && root.childNodes.length > 0) {
                sessionStorage.removeItem(RELOAD_FLAG);
              }
            } catch (e) {}
          }, 3000);
        });
      })();
    </script>
